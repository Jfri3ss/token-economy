<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
<defs><radialGradient id="glow" cx="88%" cy="0%" r="70%"><stop offset="0" stop-color="#1d5a40" stop-opacity="0.7"/><stop offset="1" stop-color="#0b0b0f" stop-opacity="0"/></radialGradient>
<style>.t{font-family:Inter,-apple-system,Helvetica,sans-serif}</style></defs>
<rect width="1280" height="520" fill="#0b0b0f"/><rect width="1280" height="520" fill="url(#glow)"/>
<text class="t" x="64" y="92" font-size="15" font-weight="600" fill="#3ddc97" letter-spacing="2">HOW IT WORKS</text>
<text class="t" x="64" y="138" font-size="38" font-weight="700" fill="#f4f4f6" letter-spacing="-0.8">Three hooks and a ledger, each at its own moment</text>
<rect x="64" y="186" width="264" height="270" rx="16" fill="#14151c" stroke="#2a2b36" stroke-width="1.5"/>
<circle cx="104" cy="230" r="18" fill="none" stroke="#3ddc97" stroke-width="2"/>
<text class="t" x="104" y="236" font-size="17" font-weight="700" fill="#3ddc97" text-anchor="middle">1</text>
<text class="t" x="134" y="236" font-size="17" fill="#9a9aa8">You send a prompt</text>
<text class="t" x="88" y="294" font-size="21" font-weight="700" fill="#f4f4f6" letter-spacing="1.2">MODEL ROUTER</text>
<text class="t" x="88" y="334" font-size="17.5" fill="#b8b8c4">Adds one routing line:</text>
<text class="t" x="88" y="361" font-size="17.5" fill="#b8b8c4">where the heavy part</text>
<text class="t" x="88" y="388" font-size="17.5" fill="#b8b8c4">runs, and on which</text>
<text class="t" x="88" y="415" font-size="17.5" fill="#b8b8c4">model.</text>
<path d="M332 321 l24 0 m-8 -7 l8 7 l-8 7" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="360" y="186" width="264" height="270" rx="16" fill="#14151c" stroke="#2a2b36" stroke-width="1.5"/>
<circle cx="400" cy="230" r="18" fill="none" stroke="#3ddc97" stroke-width="2"/>
<text class="t" x="400" y="236" font-size="17" font-weight="700" fill="#3ddc97" text-anchor="middle">2</text>
<text class="t" x="430" y="236" font-size="17" fill="#9a9aa8">Claude calls a tool</text>
<text class="t" x="384" y="294" font-size="21" font-weight="700" fill="#f4f4f6" letter-spacing="1.2">OUTPUT GUARD</text>
<text class="t" x="384" y="334" font-size="17.5" fill="#b8b8c4">Trims or refuses the</text>
<text class="t" x="384" y="361" font-size="17.5" fill="#b8b8c4">commands that would</text>
<text class="t" x="384" y="388" font-size="17.5" fill="#b8b8c4">flood the context.</text>
<text class="t" x="384" y="415" font-size="17.5" fill="#b8b8c4">#full runs it as written.</text>
<path d="M628 321 l24 0 m-8 -7 l8 7 l-8 7" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="656" y="186" width="264" height="270" rx="16" fill="#14151c" stroke="#2a2b36" stroke-width="1.5"/>
<circle cx="696" cy="230" r="18" fill="none" stroke="#3ddc97" stroke-width="2"/>
<text class="t" x="696" y="236" font-size="17" font-weight="700" fill="#3ddc97" text-anchor="middle">3</text>
<text class="t" x="726" y="236" font-size="17" fill="#9a9aa8">The turn ends</text>
<text class="t" x="680" y="294" font-size="21" font-weight="700" fill="#f4f4f6" letter-spacing="1.2">SIZED CHECK</text>
<text class="t" x="680" y="334" font-size="17.5" fill="#b8b8c4">Asks for a check sized</text>
<text class="t" x="680" y="361" font-size="17.5" fill="#b8b8c4">to the change: none for</text>
<text class="t" x="680" y="388" font-size="17.5" fill="#b8b8c4">notes, Sonnet for code,</text>
<text class="t" x="680" y="415" font-size="17.5" fill="#b8b8c4">the full one for deploys.</text>
<path d="M924 321 l24 0 m-8 -7 l8 7 l-8 7" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="952" y="186" width="264" height="270" rx="16" fill="#14151c" stroke="#2a2b36" stroke-width="1.5"/>
<circle cx="992" cy="230" r="18" fill="none" stroke="#3ddc97" stroke-width="2"/>
<text class="t" x="992" y="236" font-size="17" font-weight="700" fill="#3ddc97" text-anchor="middle">4</text>
<text class="t" x="1022" y="236" font-size="17" fill="#9a9aa8">Whenever you ask</text>
<text class="t" x="976" y="294" font-size="21" font-weight="700" fill="#f4f4f6" letter-spacing="1.2">TOKEN LEDGER</text>
<text class="t" x="976" y="334" font-size="17.5" fill="#b8b8c4">Reads your transcripts:</text>
<text class="t" x="976" y="361" font-size="17.5" fill="#b8b8c4">steps, tokens re-read,</text>
<text class="t" x="976" y="388" font-size="17.5" fill="#b8b8c4">checks and guard</text>
<text class="t" x="976" y="415" font-size="17.5" fill="#b8b8c4">denials per session.</text>
<text class="t" x="64" y="492" font-size="16" fill="#6e6e7c">Tests, lint and type checks run the same on every model. Deploys always get the full check in the main session.</text>
</svg>