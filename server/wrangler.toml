name = "token-economy-accounts"
main = "src/worker.js"
account_id = "73a8df6d594665395d19c8f0456f18fe"
compatibility_date = "2026-10-01"

# Create the database with `npx wrangler d1 create token-economy`, paste its id here,
# then `npx wrangler d1 execute token-economy --remote --file schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "token-economy"
database_id = "9b8a2f6a-a9fb-48db-9284-99949973a34d"

# Sign-in emails need both, and sign-in stays off until they're set:
#   [vars] MAIL_FROM = "token-economy <signin@your-verified-resend-domain>"
#   npx wrangler secret put RESEND_API_KEY
